name: Animoto
description: 'Animoto is a cloud-based video creation platform, founded in 2006 and headquartered
  in New York City, that lets anyone turn photos, video clips, and music into professional-looking
  videos through a drag-and-drop web editor and a large library of customizable templates. It is
  widely used for marketing and social-media videos, e-commerce and product promos, slideshows,
  real-estate tours, and personal celebration videos, and is sold as a subscription SaaS product
  across free and paid tiers. Surfaced as a portfolio company of kindred-ventures and added to the
  API Evangelist network; the company operates a consumer/SMB web application and does not currently
  publish a public developer API.'
