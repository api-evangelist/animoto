name: Animoto
description: 'Animoto is a cloud-based video creation platform, founded in 2006 and headquartered
  in New York City, that lets anyone turn photos, video clips, screen recordings and music into
  professional-looking videos through a drag-and-drop web editor and a large library of
  customizable templates. It is widely used for marketing and social-media videos, e-commerce and
  product promos, slideshows, real-estate tours, training and internal communications, and
  personal celebration videos, and is sold as subscription SaaS across free, Basic, Professional
  and Professional Plus tiers. Animoto is part of the Redbrick family of brands. It was surfaced
  as a portfolio company of kindred-ventures. Animoto formerly ran a partner-facing REST API for
  programmatic video directing and rendering: the API host api.animoto.com is still live and
  answers every request with an HTTP Basic challenge, but the developer program around it has been
  retired — animoto.com/developer now serves the marketing homepage, developer.animoto.com and the
  documented partner sandbox hosts no longer resolve, the help center Developer Resources section
  is empty, and the official Animoto API Ruby client has not been released since 2013.'
