apis:
- aid: animoto:api
  name: Animoto API
  description: >-
    The Animoto API is a partner-facing RESTful web service for programmatically directing and
    rendering videos from images, video clips, music and text. The host is live and authenticating
    (HTTP Basic, realm "Application", observed 2026-08-13) but Animoto publishes no reference
    documentation, no machine-readable contract, and no route to request credentials; the
    developer program that supported it has been retired. Recorded here because the service is
    real and running, not to assert that it is publicly available.
  baseURL: https://api.animoto.com
